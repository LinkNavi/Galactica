name: Release Busybox

on:
  push:
    tags:
      - 'busybox-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        default: '1.35.0'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get busybox
        run: sudo apt-get install -y busybox-static

      - name: Package
        run: |
          mkdir release
          cp /bin/busybox release/
          tar -czf busybox-${{ inputs.version }}.tar.gz -C release .

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: busybox-${{ inputs.version }}
          name: Busybox ${{ inputs.version }}
          files: busybox-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
