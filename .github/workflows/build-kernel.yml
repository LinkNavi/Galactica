name: Build Galactica Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Kernel version'
        default: '6.18.4'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make bc flex bison libssl-dev libelf-dev \
            libncurses-dev pahole dwarves cpio xz-utils

      - name: Download kernel source
        run: |
          VERSION="${{ github.event.inputs.kernel_version }}"
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${VERSION}.tar.xz"
          tar -xf "linux-${VERSION}.tar.xz"

      - name: Configure kernel
        run: |
          VERSION="${{ github.event.inputs.kernel_version }}"
          cd "linux-${VERSION}"
          cp ../kernel.config .config
          make olddefconfig

      - name: Build kernel
        run: |
          VERSION="${{ github.event.inputs.kernel_version }}"
          cd "linux-${VERSION}"
          make -j$(nproc) 2>&1 | tail -20
          echo "Build exit code: $?"

      - name: Install modules to staging dir
        run: |
          VERSION="${{ github.event.inputs.kernel_version }}"
          mkdir -p staging/lib/modules
          mkdir -p staging/boot
          cd "linux-${VERSION}"
          make modules_install INSTALL_MOD_PATH="../staging"
          cp arch/x86/boot/bzImage ../staging/boot/vmlinuz-galactica
          echo "${VERSION}" > ../staging/boot/.kernel-version

      - name: Package artifacts
        run: |
          VERSION="${{ github.event.inputs.kernel_version }}"
          tar -czf "galactica-kernel-${VERSION}.tar.gz" -C staging .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: galactica-kernel-${{ github.event.inputs.kernel_version }}
          path: galactica-kernel-${{ github.event.inputs.kernel_version }}.tar.gz
          retention-days: 7
