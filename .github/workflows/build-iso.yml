name: Build ISO
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TERM: linux
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing \
            grub-pc-bin grub-efi-amd64-bin xorriso grub-common mtools \
            golang gcc g++ make \
            libcurl4-openssl-dev libssl-dev libarchive-dev libzstd-dev \
            zlib1g-dev libbz2-dev

      - name: Download kernel artifact
        run: |
          gh run download --repo LinkNavi/Galactica \
            --name galactica-kernel-6.18.4 \
            --dir kernel-artifact || echo "No kernel artifact found"
          if [ -f kernel-artifact/galactica-kernel-6.18.4.tar.gz ]; then
            mkdir -p $HOME/kernels/galactica
            tar -xzf kernel-artifact/galactica-kernel-6.18.4.tar.gz -C $HOME/kernels/galactica
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build components
        run: |
          # Build poyo
          cd Poyo
          gcc -Wall -Wextra -O2 -D_GNU_SOURCE -fstack-protector-strong \
              -o poyo src/main.c -lcrypt
          cd ..

          # Build AirRide Init (use Makefile so all source files are compiled)
          cd AirRide/Init
          make
          cd ../..

          # Build AirRide Ctl
          cd AirRide/Ctl && mkdir -p build
          g++ -o build/airridectl src/main.cpp -Wall -Wextra -O2 -std=c++17
          cd ../..

          # Build Dreamland
          cd Dreamland && mkdir -p build
          g++ -o build/dreamland src/main.cpp \
              -std=c++20 -O2 -Wall -Wextra -fPIC \
              -lcurl -lssl -lcrypto -lz -lzstd -larchive -lpthread -ldl
          cd ..

      - name: Prepare build dir and ISO
        run: |
          echo "y" | TERM=linux bash build-and-launch.sh --fetch || true
          echo "y" | TERM=linux bash make-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: galactica-installer-iso
          path: galactica-installer.iso
          retention-days: 7
