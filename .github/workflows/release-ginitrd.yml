name: Release ginitrd

on:
  push:
    tags:
      - 'ginitrd-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        default: '1.0.0'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: |
          mkdir release
          cp ginitrd/ginitrd.sh release/
          tar -czf ginitrd-${{ inputs.version }}.tar.gz -C release .

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ginitrd-${{ inputs.version }}
          name: ginitrd ${{ inputs.version }}
          files: ginitrd-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
