name: Release Poyo

on:
  push:
    tags:
      - 'poyo-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        default: '1.1.0'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Poyo
        run: |
          cd Poyo
          gcc -Wall -Wextra -O2 -D_GNU_SOURCE -fstack-protector-strong \
              -o poyo src/main.c -lcrypt

      - name: Package
        run: |
          mkdir release
          cp Poyo/poyo release/
          tar -czf poyo-${{ inputs.version }}.tar.gz -C release .

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: poyo-${{ inputs.version }}
          name: Poyo ${{ inputs.version }}
          files: poyo-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
